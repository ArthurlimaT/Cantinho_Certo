name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check browser JavaScript syntax
        run: |
          for file in public/js/*.js; do
            node --check "$file"
          done

      - name: Run tests
        run: npm test

      - name: Build Astro site
        run: npm run build
